<!doctype html>
<html><head><meta charset="utf-8">
<script src="./vendor/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
@font-face{font-family:'Caveat';font-weight:700;src:url('./vendor/fonts/caveat-latin-700-normal.woff2') format('woff2')}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f7f2e7}
#root{position:relative;width:1920px;height:1080px;overflow:hidden}
canvas{position:absolute;inset:0;width:1920px;height:1080px}
h1{position:absolute;left:120px;top:120px;margin:0;font:700 180px/1 'Caveat';color:#38352f}
</style></head>
<body><div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="5">
<canvas id="c" width="1920" height="1080"></canvas>
<h1 id="t">Dots &amp; Boxes</h1>
</div>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(1920,1080,false);
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(35,16/9,0.1,100); cam.position.set(0,3,8); cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xccbb99,1.2)); const d=new THREE.DirectionalLight(0xffffff,2); d.position.set(3,5,4); scene.add(d);
const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0x2f6bd8}));
scene.add(box);
const st={t:0};
const draw=t=>{box.rotation.y=t*1.2; box.rotation.x=0.3+0.2*Math.sin(t); r.render(scene,cam);};
const tl=gsap.timeline({paused:true});
tl.fromTo('#t',{x:-200,opacity:0.2},{x:600,opacity:1,duration:5,ease:'power2.inOut'},0);
tl.to(st,{t:5,duration:5,ease:'none',onUpdate:()=>draw(st.t)},0);
window.__timelines=window.__timelines||{}; window.__timelines.root=tl;
await document.fonts.ready; draw(0);
</script>
</body></html>
